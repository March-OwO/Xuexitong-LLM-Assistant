<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 背景：模拟学习通课程页面 -->
  <rect width="680" height="460" fill="#f2f3f5"/>
  <rect x="24" y="20" width="632" height="40" rx="8" fill="#ffffff"/>
  <rect x="40" y="32" width="180" height="14" rx="7" fill="#e4e7ed"/>
  <rect x="24" y="76" width="200" height="360" rx="8" fill="#ffffff"/>
  <rect x="44" y="100" width="150" height="12" rx="6" fill="#e4e7ed"/>
  <rect x="44" y="124" width="160" height="12" rx="6" fill="#ebeef5"/>
  <rect x="44" y="148" width="130" height="12" rx="6" fill="#ebeef5"/>
  <rect x="44" y="172" width="150" height="12" rx="6" fill="#ebeef5"/>
  <rect x="260" y="100" width="396" height="300" rx="8" fill="#ffffff"/>
  <rect x="284" y="128" width="120" height="12" rx="6" fill="#e4e7ed"/>
  <rect x="284" y="156" width="340" height="10" rx="5" fill="#ebeef5"/>
  <rect x="284" y="176" width="300" height="10" rx="5" fill="#ebeef5"/>
  <rect x="284" y="220" width="340" height="120" rx="6" fill="#f7f8fa"/>

  <!-- 悬浮窗面板 -->
  <g>
    <rect x="396" y="250" width="268" height="190" rx="14" fill="#ffffff" stroke="#ebeef5" stroke-width="1"/>
    <rect x="396" y="250" width="268" height="34" rx="14" fill="#409eff"/>
    <rect x="396" y="268" width="268" height="16" fill="#409eff"/>
    <text x="412" y="272" fill="#ffffff" font-size="13" font-weight="600">学习通 AI 学习助手</text>
    <!-- tabs -->
    <rect x="412" y="296" width="56" height="22" rx="6" fill="#ecf5ff"/>
    <text x="424" y="311" fill="#409eff" font-size="12">运行框</text>
    <text x="480" y="311" fill="#909399" font-size="12">运行日志</text>
    <text x="540" y="311" fill="#909399" font-size="12">声明</text>
    <!-- 状态 -->
    <text x="412" y="350" fill="#303133" font-size="13">状态：执行任务中</text>
    <rect x="412" y="364" width="236" height="1" fill="#f0f0f0"/>
    <text x="412" y="388" fill="#67c23a" font-size="12">输入 Token：1,284</text>
    <text x="412" y="408" fill="#909399" font-size="12">输出 Token：562</text>
    <text x="412" y="428" fill="#c0c4cc" font-size="11">配置 · 打开配置</text>
  </g>

  <!-- 右下角毛玻璃 AI 按钮 -->
  <g>
    <circle cx="636" cy="430" r="26" fill="#409eff" fill-opacity="0.28" stroke="#409eff" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="636" y="437" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">AI</text>
  </g>

  <text x="340" y="448" fill="#c0c4cc" font-size="11" text-anchor="middle">示意图：右下角毛玻璃 AI 按钮 + 悬浮窗（请替换为真实截图）</text>
</svg>
